name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Typecheck, lint, and Worker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install
        run: npm ci

      - name: Cloudflare local env
        run: cp .dev.vars.example .dev.vars

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: OpenNext Worker build
        run: npm run build
